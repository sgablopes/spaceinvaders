name: agrion-analisys
services:
  agrion-data:
    build: .
    environment:
      NASA_POWER_TIMEOUT_SECONDS: "${NASA_POWER_TIMEOUT_SECONDS:-40}"
      NASA_POWER_MAX_RETRIES: "${NASA_POWER_MAX_RETRIES:-1}"
      NASA_POWER_CACHE_TTL_SECONDS: "${NASA_POWER_CACHE_TTL_SECONDS:-300}"
      NASA_POWER_CACHE_ENTRIES: "${NASA_POWER_CACHE_ENTRIES:-128}"
      METEOMATICS_USERNAME: "${METEOMATICS_USERNAME:-}"
      METEOMATICS_PASSWORD: "${METEOMATICS_PASSWORD:-}"
      METEOMATICS_TIMEOUT_SECONDS: "${METEOMATICS_TIMEOUT_SECONDS:-30}"
      METEOMATICS_MAX_RETRIES: "${METEOMATICS_MAX_RETRIES:-1}"
      METEOMATICS_CACHE_TTL_SECONDS: "${METEOMATICS_CACHE_TTL_SECONDS:-300}"
      METEOMATICS_CACHE_ENTRIES: "${METEOMATICS_CACHE_ENTRIES:-64}"
      METEOMATICS_MAX_FORECAST_DAYS: "${METEOMATICS_MAX_FORECAST_DAYS:-7}"
    ports:
      - "127.0.0.1:${ANALISYS_PORT:-8001}:8000"
    volumes:
      - catalog:/service/.runtime
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - data
networks:
  data:
    name: agrion-analisys-data
volumes:
  catalog:
