name: agrion-analisys
services:
  agrion-data:
    build: .
    ports:
      - "127.0.0.1:${ANALISYS_PORT:-8001}:8000"
    volumes:
      - catalog:/service/.runtime
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - data
networks:
  data:
    name: agrion-analisys-data
volumes:
  catalog:
