services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGRION_LOG_LEVEL: ${AGRION_LOG_LEVEL:-INFO}
      AGRION_PUBLIC_ORIGIN: ${AGRION_PUBLIC_ORIGIN:-https://agrion.earth}
      MAPTILER_API_KEY: ${MAPTILER_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-}
      GOOGLE_CLOUD_EXTRACTION_LOCATION: ${GOOGLE_CLOUD_EXTRACTION_LOCATION:-us}
      GOOGLE_CLOUD_ENGINE_LOCATION: ${GOOGLE_CLOUD_ENGINE_LOCATION:-us}
      GEMINI_ENGINE_MODEL: ${GEMINI_ENGINE_MODEL:-gemini-3.8-flash}
      AGRION_ANALYSIS_URL: ${AGRION_ANALYSIS_URL:-http://agrion-data:8000}
      AGRION_STATION_KEYS: ${AGRION_STATION_KEYS:-}
      AGRION_STATION_DB_PATH: /var/lib/agrion/stations.sqlite3
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.8-live}
      GEMINI_EXTRACTION_MODEL: ${GEMINI_EXTRACTION_MODEL:-gemini-3.5-flash-lite}
      AGRION_INTERVIEW_NORMAL_SECONDS: ${AGRION_INTERVIEW_NORMAL_SECONDS:-180}
      AGRION_INTERVIEW_GRACE_SECONDS: ${AGRION_INTERVIEW_GRACE_SECONDS:-120}
      AGRION_INTERVIEW_ABSOLUTE_SECONDS: ${AGRION_INTERVIEW_ABSOLUTE_SECONDS:-300}
      AGRION_LIVE_SESSIONS_PER_HOUR: ${AGRION_LIVE_SESSIONS_PER_HOUR:-8}
      AGRION_EXTRACTIONS_PER_HOUR: ${AGRION_EXTRACTIONS_PER_HOUR:-120}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - agrion-analysis
    volumes:
      - station-data:/var/lib/agrion
networks:
  agrion-analysis:
    external: true
    name: agrion-analisys-data
volumes:
  station-data:
