  function openDb(){return new Promise(resolve=>{try{const req=indexedDB.open('flora-demo-registros-v1',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('records'))d.createObjectStore('records',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null);req.onblocked=()=>resolve(null)}catch(e){resolve(null)}})}
  function readAll(){return new Promise(resolve=>{if(!db)return resolve([]);try{const tx=db.transaction('records','readonly');const req=tx.objectStore('records').getAll();req.onsuccess=()=>resolve((req.result||[]).sort((a,b)=>b.created-a.created));req.onerror=()=>resolve([])}catch(e){resolve([])}})}
  function addRecord(r){return new Promise((resolve,reject)=>{if(!db)return reject(new Error('Armazenamento local indisponível'));try{const tx=db.transaction('records','readwrite');tx.objectStore('records').put(r);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Falha ao salvar'));tx.onabort=()=>reject(tx.error||new Error('Gravação interrompida'))}catch(e){reject(e)}})}
  function removeAllRecords(){return new Promise((resolve,reject)=>{if(!db)return resolve();const tx=db.transaction('records','readwrite');tx.objectStore('records').clear();tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
  function getPhotoURL(r){if(!r||!r.photo)return null;if(!photoURLs.has(r.id))photoURLs.set(r.id,URL.createObjectURL(r.photo));return photoURLs.get(r.id)}
  function prepareFile(file){photoFile=file;if(previewURL)URL.revokeObjectURL(previewURL);previewURL=file?URL.createObjectURL(file):null;render()}
  function clearFile(){photoFile=null;if(previewURL){URL.revokeObjectURL(previewURL);previewURL=null}}
  function navigate(page){state.page=page;state.modal=null;persist();render();window.scrollTo({top:0,behavior:'instant'})}
  function beginAssistant(context,from){state.assistantContext=context;state.assistantReturn=from||state.page;navigate('assistant')}
  function navItem(page,label,ico){return `<button type="button" class="navitem ${active(page)?'active':''}" data-action="nav" data-page="${page}" aria-current="${active(page)?'page':'false'}">${icon(ico,19)} ${label}</button>`}
  function active(p){return state.page===p||(p==='plan'&&['discover','compare'].includes(state.page))||(p==='map'&&state.page==='recordDetail')||(p==='safra'&&state.page==='record')}
  function btn(text,action,cls='btn-primary',extra=''){return `<button type="button" class="btn ${cls}" data-action="${action}" ${extra}>${text}</button>`}
  function infoCard(text,kind=''){return `<div class="callout ${kind==='warning'?'callout-warning':kind==='error'?'callout-error':''}">${icon(kind==='warning'?'alert':'info',17)}<span>${text}</span></div>`}
  function headerTitle(eyebrow,title,desc=''){return `<div class="page-intro"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div>`}
  function sectionHeader(title,button=''){return `<div class="section-head"><h3>${title}</h3>${button}</div>`}

  function fieldDrawing(){return `<svg viewBox="0 0 480 300" role="img" aria-label="Ilustração conceitual de talhões, sem localização geográfica real"><defs><pattern id="rows" patternUnits="userSpaceOnUse" width="13" height="13" patternTransform="rotate(-30)"><path d="M1 0v13" stroke="#4D7850" opacity=".2" stroke-width="3"/></pattern></defs><rect width="480" height="300" rx="16" fill="#DDE9D7"/><path d="M-15 75C130 55 180 140 500 118M35 -10C50 110 135 180 120 320" stroke="#F8F7E8" fill="none" stroke-width="20"/><path d="M100 58 274 34 325 133 146 171Z" class="map-area ${state.mapField==='Talhão 1'?'selected':''}" data-mapfield="Talhão 1"/><path d="M150 179 331 143 396 247 208 275Z" class="map-area ${state.mapField==='Talhão 2'?'selected':''}" data-mapfield="Talhão 2"/><path d="M100 58 274 34 325 133 146 171Z" fill="url(#rows)" pointer-events="none"/><path d="M150 179 331 143 396 247 208 275Z" fill="url(#rows)" pointer-events="none"/><text x="205" y="108" fill="#224B30" font-family="Inter, sans-serif" font-weight="800" font-size="14" text-anchor="middle" pointer-events="none">Talhão 1</text><text x="268" y="220" fill="#224B30" font-family="Inter, sans-serif" font-weight="800" font-size="14" text-anchor="middle" pointer-events="none">Talhão 2</text><path d="M405 46v-19m-8 8 8-8 8 8" stroke="#43684A" stroke-width="3" fill="none" stroke-linecap="round"/><text x="405" y="57" fill="#43684A" font-size="10" text-anchor="middle">N</text></svg>`}
  function heroArt(){return `<svg class="hero-illustration" viewBox="0 0 270 220" aria-hidden="true"><circle cx="175" cy="102" r="97" fill="#D8E889" opacity=".13"/><path d="M32 211C110 165 186 151 276 162M11 206C101 138 170 127 276 137M40 189C105 126 188 105 276 109M88 193C158 155 206 156 277 170" fill="none" stroke="#C5E8B0" stroke-width="5" opacity=".55"/><path d="M172 190c-3-52 28-92 65-107-6 46-18 80-65 107Zm-5-13c-20-63-64-82-100-90 13 48 42 77 100 90Z" fill="#D8E889" opacity=".65"/><path d="M171 213c-4-66 7-103 60-124" fill="none" stroke="#D8E889" stroke-width="6" stroke-linecap="round"/></svg>`}

      <div class="field-group"><label class="label" for="farm">Nome da propriedade <span class="muted">(opcional)</span></label><input class="field" id="farm" data-bind="farm" value="${safe(state.farm)}" placeholder="Ex.: Sítio Esperança"></div>
      <div class="field-group"><label class="label" for="region">Município e estado</label><input class="field" id="region" data-bind="region" value="${safe(state.region)}" placeholder="Ex.: Sorocaba, SP"><div class="form-help">Nesta versão, o texto não é geocodificado nem validado. No produto real, será preciso confirmar no mapa.</div></div>

      ['existing','Já tenho uma produção','Quero analisar culturas que cultivo hoje.'],['interested','Tenho algumas culturas em mente','Quero investigar possibilidades específicas.'],['undecided','Ainda não sei o que plantar','Quero descobrir por onde posso começar.']].map(x=>`<button class="choice ${state.experience===x[0]?'selected':''}" data-action="experience" data-value="${x[0]}"><span class="grow"><strong>${x[1]}</strong><p>${x[2]}</p></span><span class="radio-mark" aria-hidden="true"></span></button>`).join('')}</div>
      ${state.experience!=='undecided'?`<div style="margin-top:20px"><label class="label">Culturas conhecidas ou de interesse (opcional)</label><div class="flow-tags">${briefCrops.map(c=>`<button class="chip ${state.crops.includes(c.name)?'active':''}" data-action="toggleCrop" data-name="${c.name}">${state.crops.includes(c.name)?icon('check',12):icon('plus',12)} ${c.name}</button>`).join('')}</div></div>`:
      `<div class="callout" style="margin-top:20px">${icon('spark',18)}<span><b>Sem problema.</b> O aplicativo mostrará culturas para investigar, usando critérios regionais, científicos e de mercado quando as fontes estiverem conectadas.</span></div>`}`;
    if(step===2)body=`<h2>O que você sabe sobre o solo?</h2><p class="muted" style="margin-top:9px">Você não precisa conhecer pH, textura ou nutrientes para avançar. As análises deixarão claras as lacunas.</p><div class="choice-stack" style="margin-top:20px">${[
      ['unknown','Ainda não conheço as características','Poderei acrescentar medições e análises depois.'],['some','Tenho informações parciais','Algumas observações ou medições já foram feitas.'],['lab','Tenho análise laboratorial','Desejo utilizar o documento futuramente.']].map(x=>`<button class="choice ${state.soil===x[0]?'selected':''}" data-action="soil" data-value="${x[0]}"><span class="grow"><strong>${x[1]}</strong><p>${x[2]}</p></span><span class="radio-mark"></span></button>`).join('')}</div>

    if(step===3)body=`<h2>O que é mais importante?</h2><p class="muted" style="margin-top:9px">As prioridades orientam a comparação, mas não substituem restrições agronômicas.</p><div class="choice-stack" style="margin-top:18px">${[
      ['balanced','Equilibrar critérios','Economia, solo, água e riscos.'],['profit','Retorno econômico','Avaliar custos, preços e cenários.'],['soil','Saúde do solo','Considerar práticas e restrições do solo.'],['water','Disponibilidade de água','Avaliar sazonalidade e irrigação.'],['risk','Reduzir riscos','Investigar exposição climática e operacional.']].map(x=>`<button class="choice ${state.goal===x[0]?'selected':''}" data-action="goal" data-value="${x[0]}"><span class="grow"><strong>${x[1]}</strong><p>${x[2]}</p></span><span class="radio-mark"></span></button>`).join('')}</div>

  function plan(){const ps=plans(),p=pselected(),a=ps.find(x=>x.id===state.compareA),b=ps.find(x=>x.id===state.compareB);

  function recordLine(r){return `<button type="button" class="event-content" style="display:block;width:100%;text-align:left;margin:9px 0" data-action="viewRecord" data-id="${safe(r.id)}"><div class="row align-start"><div class="crop-thumb" style="width:39px;height:39px">${icon(r.type==='meter'?'droplet':r.type==='plant'?'camera':r.type==='pest'?'alert':'journal',20)}</div><div class="grow"><h4>${r.type==='meter'?'Medição de solo':r.type==='plant'?'Foto de planta':r.type==='pest'?'Ocorrência / sintoma':'Observação'}</h4><div class="tiny">${safe(r.field)} · ${new Date(r.created).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div><p style="font-size:12px;margin-top:5px">${safe(r.note||'Registro sem descrição')}</p><div class="tiny" style="margin-top:5px">Salvo neste dispositivo · não sincronizado</div></div>${icon('chevron',16)}</div></button>`}
  function recordPage(){

      ${typ==='meter'?`<div class="divider divider-space"></div><h3>Conferir leituras manualmente</h3><p class="muted" style="font-size:12px;margin-top:6px">A extração por IA não está conectada. Digite os valores observados no visor. Campos em branco ficam não informados.</p><div class="grid two" style="margin-top:10px">

      <div class="section-gap"><div class="card"><div class="row">${icon('pin',21)}<h3>Localização</h3></div><p class="muted" style="font-size:12px;margin:10px 0">Se o GPS estiver disponível, você pode associar uma posição real ao registro. Ela não será colocada automaticamente no mapa fictício.</p>${btn(`${icon('location',17)} Obter localização atual`,'getGPS','btn-secondary btn-block btn-sm')}
      <div style="margin-top:10px" class="tiny">${state.recordLat!==null?`Coordenadas obtidas: ${Number(state.recordLat).toFixed(5)}, ${Number(state.recordLong).toFixed(5)}${state.recordLocationAccuracy?` · precisão estimada: ${Math.round(state.recordLocationAccuracy)} m`:''}`:'Sem coordenadas. O talhão será mantido como referência.'}</div></div>

  function recordDetail(){const r=records.find(x=>x.id===state.viewRecord);if(!r)return `<div class="empty"><h3>Registro não encontrado</h3>${btn('Voltar ao diário','toSafra')}</div>`;

    return `${headerTitle('Registro de campo','Detalhes da observação.','Informações gravadas neste dispositivo, sem envio para servidor externo.')}

      ${r.note?`<div style="margin-top:18px"><h4>Descrição</h4><p style="font-size:13px;margin-top:8px">${safe(r.note)}</p></div>`:''}

      <div class="section-gap"><div class="card"><h3>Origem e localização</h3><div class="stack" style="margin-top:13px"><div class="row">${icon('clipboard',17)}<span style="font-size:12px">Fonte: ${r.type==='meter'?'entrada manual do agricultor':'registro do usuário'}</span></div><div class="row">${icon('pin',17)}<span style="font-size:12px">${safe(r.field)}</span></div><div class="row align-start">${icon('location',17)}<span style="font-size:12px">${r.lat!==null&&r.lat!==undefined?`${Number(r.lat).toFixed(5)}, ${Number(r.long).toFixed(5)} · precisão ${r.accuracy?Math.round(r.accuracy)+' m':'não informada'}`:'Sem coordenadas GPS'}</span></div></div></div>

      ${btn(`${icon('back',17)} Voltar ao diário`,'toSafra','btn-secondary btn-block')}</div></div>`;

  function safra(){
    const seasons={none:['Nenhuma safra ativa','Você pode planejar ou realizar observações independentes.'],planned:['Planejamento selecionado','O cultivo ainda não foi confirmado como iniciado.'],active:['Safra em andamento','O início do cultivo foi confirmado nesta demonstração.'],closed:['Safra encerrada','O histórico permanece disponível para consulta.']};const [title,desc]=seasons[state.season];let v=records.filter(r=>state.filterDiary==='all'||r.type===state.filterDiary);
    return `${headerTitle('Minha Safra','Seu diário agrícola.','Acompanhe a produção e preserve as observações realizadas no campo.')}

      <div class="card"><div class="row align-start">${icon('info',20)}<div class="grow"><h3>${title}</h3><p class="muted" style="margin-top:6px;font-size:12px">${desc}</p></div></div><div class="bottom-actions">${state.season==='none'?btn('Explorar planejamento','toDiscover','btn-secondary') : state.season==='planned'?btn(`${icon('check',16)} Confirmar início do cultivo`,'askStartSeason','btn-primary'):state.season==='active'?btn(`${icon('archive',16)} Encerrar safra`,'askCloseSeason','btn-secondary'):btn('Rever planejamento','toPlan','btn-secondary')}</div></div>
      ${sectionHeader('Diário de campo',`<span class="pill pill-neutral">${records.length} registros</span>`)}<div class="tabline">${[['all','Todos'],['meter','Solo'],['plant','Plantas'],['pest','Ocorrências'],['note','Notas']].map(x=>`<button class="tab ${state.filterDiary===x[0]?'active':''}" data-action="filterDiary" data-id="${x[0]}">${x[1]}</button>`).join('')}</div>
      ${v.length?`<div class="timeline">${v.map(r=>`<div class="event"><div class="event-content" role="button" tabindex="0" data-action="viewRecord" data-id="${safe(r.id)}"><div class="row between align-start"><h4>${r.type==='meter'?'Medição de solo':r.type==='plant'?'Fotografia da planta':r.type==='pest'?'Ocorrência registrada':'Anotação de campo'}</h4>${icon('chevron',17)}</div><div class="tiny" style="margin-top:5px">${safe(r.field)} · ${new Date(r.created).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div><p style="font-size:12px;margin-top:6px">${safe(r.note||'Registro com valores ou fotografia')}</p><span class="tiny">Salvo localmente</span></div></div>`).join('')}</div>`:`<div class="empty">${icon('journal',30)}<h3>Nenhum registro encontrado</h3><p style="font-size:12px">Registre uma medição, fotografia ou anotação para iniciar o histórico.</p>${btn(`${icon('plus',17)} Novo registro`,'newRecord','btn-primary btn-sm')}</div>`}</div>
      <div class="section-gap"><div class="card"><h3>Ações de campo</h3><p class="muted" style="font-size:12px;margin:9px 0 15px">As observações serão compartilhadas com a área de mapa e poderão ser consultadas pelo assistente.</p>${btn(`${icon('camera',17)} Registrar observação`,'newRecord','btn-primary btn-block')}<div style="margin-top:9px">${btn(`${icon('map',17)} Ver no mapa`,'toMap','btn-secondary btn-block')}</div></div>

      <div class="section-gap"><div class="card"><h3>Próxima investigação</h3><p class="muted" style="font-size:12px;margin:10px 0 17px">Faça uma pergunta ao assistente com o contexto desta informação. A IA ainda não responde neste protótipo.</p>${btn(`${icon('brain',17)} Investigar com assistente`,'assistantFromArticle','btn-primary btn-block')}<div style="margin-top:9px">${btn(`${icon(state.bookmarks.includes(s.id)?'circlecheck':'book',16)} ${state.bookmarks.includes(s.id)?'Salvo para consultar':'Salvar referência'}`,'toggleBookmark','btn-secondary btn-block')}</div></div>${infoCard('Notícias e estudos deverão ser vinculados a fontes e datas verificadas. Mudanças de planejamento exigirão investigação e confirmação humana.','warning')}</div></div>`;
  }
  function assistant(){return `${headerTitle('Assistente Agrion','Pergunte com contexto.','Converse sobre registros, estratégias ou informações da sua propriedade.')}
      <div class="grid main-cols"><div class="section-gap"><div class="card card-soft"><div class="row">${icon('brain',21)}<div class="grow"><h3>Contexto selecionado</h3><p class="muted" style="font-size:12px;margin-top:5px">${safe(state.assistantContext)}</p></div></div></div>
      ${infoCard('Esta é a interface do assistente; não há IA, consulta a fontes ou resposta automática conectada. Suas perguntas ficam apenas no protótipo.','warning')}
      <div class="card" style="min-height:230px"><div class="stack">${state.messages.length?state.messages.map(m=>`<div class="chat-bubble ${m.role==='user'?'user':'system'}">${safe(m.text)}</div>`).join(''):`<div class="empty" style="border:0;background:transparent">${icon('brain',33)}<h3>O que gostaria de investigar?</h3><p style="font-size:12px">Selecione uma pergunta abaixo ou escreva a sua.</p></div>`}</div></div>
      <div class="flow-tags">${['O que devo observar neste talhão?','Como verificar as fontes da estratégia?','Como registrar um possível sintoma?'].map(questionChip).join('')}</div>
      <div class="card"><label class="label" for="assistantInput">Sua pergunta</label><textarea id="assistantInput" class="field" placeholder="Pergunte sobre sua cultura, solo ou estratégia..." rows="3"></textarea><div class="bottom-actions">${btn(`${icon('send',17)} Registrar pergunta`,'sendQuestion','btn-primary')}${btn(`${icon('clipboard',17)} Criar registro`,'assistantToRecord','btn-secondary')}</div></div>
      </div><div class="section-gap"><div class="card"><h3>O que a IA poderá consultar?</h3><div class="stack" style="margin-top:14px">${[['pin','Localização e dados autorizados'],['journal','Registros e observações'],['compare','Estratégias e premissas'],['book','Publicações verificáveis']].map(x=>`<div class="row">${icon(x[0],18)}<span style="font-size:12px">${x[1]}</span></div>`).join('')}</div><p class="tiny" style="margin-top:15px">No MVP, a resposta deverá citar fontes e sinalizar lacunas e incertezas.</p></div>${btn(`${icon('back',16)} Voltar à origem`,'assistantBack','btn-secondary btn-block')}</div></div>`}
  function modalHtml(){if(!state.modal)return '';const config={start:{title:'Confirmar início do cultivo?',text:'Isso mudará o estado do planejamento para safra em andamento nesta demonstração. Não executará nenhuma ação agrícola real.',action:'confirmStart',button:'Confirmar início'},close:{title:'Encerrar esta safra?',text:'O histórico continuará armazenado neste navegador. O encerramento será apenas demonstrativo.',action:'confirmClose',button:'Encerrar safra'},reset:{title:'Reiniciar o protótipo?',text:'Isso apagará os dados do cadastro, as preferências e os registros e fotografias salvos neste navegador para esta demonstração.',action:'confirmReset',button:'Apagar dados locais'}}[state.modal];if(!config)return '';
    return `<div class="modal-backdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div style="color:var(--primary)">${icon('alert',27)}</div><h3 id="modalTitle">${config.title}</h3><p>${config.text}</p><div class="modal-actions"><button class="btn btn-secondary" data-action="cancelModal">Cancelar</button><button class="btn btn-primary" data-action="${config.action}">${config.button}</button></div></div></div>`;
  }
  const meta={home:'Início',onboarding:'Cadastro',discover:'Descobrir culturas',plan:'Planejamento',map:'Minha propriedade',record:'Novo registro',recordDetail:'Detalhe do registro',safra:'Minha Safra',intelligence:'Inteligência',article:'Detalhe da informação',assistant:'Assistente'};
  function mainPage(){return ({home, onboarding, discover, plan, map:mapPage, record:recordPage,recordDetail,safra,intelligence,article:articlePage,assistant})[state.page]?.()||home()}
  function welcome(){
    return `<main class="welcome-page"><div class="welcome-layout">
      <div class="welcome-visual"><picture><source media="(min-width: 768px)" srcset="{{ url_for('static', filename='agrion-hero-desktop.jpg') }}"><img src="{{ url_for('static', filename='agrion-hero-mobile.jpg') }}" alt="Lavoura ao nascer do sol" fetchpriority="high"></picture></div>
      <div class="welcome-brand"><span class="welcome-brand-icon">${icon('leaf',23)}</span><span>Agrion</span></div>
      <div class="welcome-copy"><h1>O futuro da sua lavoura começa com uma conversa.</h1><p class="welcome-subtitle">Dados da NASA, conhecimento agrícola e inteligência artificial trabalhando juntos para ajudar você a tomar decisões melhores.</p>
        <div class="welcome-benefits">
          <div class="welcome-benefit"><span class="welcome-benefit-icon">${icon('chat',27)}</span><div><h2>Conte sobre sua lavoura</h2><p>O que você plantou, como foi a colheita e quais são seus objetivos.</p></div></div>
          <div class="welcome-benefit"><span class="welcome-benefit-icon">${icon('sprout',28)}</span><div><h2>Descubra o que plantar</h2><p>Explore culturas e rotações considerando clima, solo e histórico da sua região.</p></div></div>
          <div class="welcome-benefit"><span class="welcome-benefit-icon">${icon('chart',27)}</span><div><h2>Decida com mais confiança</h2><p>Compare riscos, oportunidades e potencial de retorno para sua próxima safra.</p></div></div>
        </div><div class="welcome-actions"><button type="button" class="btn btn-primary" data-action="propertyEnter">Entrar ${icon('arrow',18)}</button></div>
      </div></div></main><div id="toastMount" aria-live="polite"></div>`;
  }
  function render(){const navs=[['home','Início','home'],['plan','Planejar','compare'],['map','Mapa','map'],['safra','Safra','journal']];
    if(AgrionDiscovery.view()!=='none'){$('app').innerHTML=AgrionDiscovery.markup();AgrionDiscovery.afterRender();return}
    if(AgrionProperty.view()!=='welcome'){$('app').innerHTML=AgrionProperty.markup();renderToast();AgrionProperty.afterRender();return}
    if(state.page==='home'){$('app').innerHTML=welcome();renderToast();return}
    $('app').innerHTML=`<div class="app"><aside class="sidebar" aria-label="Navegação principal"><div class="brand"><div class="brand-logo">${icon('sprout',26)}</div><div><div class="brand-name">Agrion<span style="color:#A8C96C">.</span></div><div class="brand-tag">Cultive decisões melhores.</div></div></div><div class="navlabel">EXPERIÊNCIA</div>${navs.map(n=>navItem(...n)).join('')}<div class="navlabel">INTELIGÊNCIA</div>${navItem('intelligence','Inteligência','news')}${navItem('assistant','Assistente','brain')}<div class="side-bottom"><div class="demo-stamp">${icon('spark',16)} Protótipo interativo V3.1</div><p class="side-note">Dados agrícolas demonstrativos; sem integrações NASA ou IA.</p><button class="text-link" data-action="askReset" style="margin-top:11px">${icon('reset',15)} Reiniciar demonstração</button></div></aside>
      <div class="workspace"><main class="content"><div class="topbar"><div class="mobile-head"><div class="brand-logo">${icon('sprout',22)}</div><div><div class="brand-name">Agrion<span style="color:#A8C96C">.</span></div><div class="brand-tag">PROTÓTIPO V3.1</div></div></div><div class="bread">AGRION / ${safe(meta[state.page]||'Início')} <span style="color:#9AA694">· EXPERIÊNCIA DE DEMONSTRAÇÃO</span></div><div class="top-actions"><button class="chip ${state.offlineSim?'active':''}" data-action="toggleOffline" title="Simula indisponibilidade de serviços online; não altera a conexão real">${icon(state.offlineSim?'wifioff':'wifi',15)} <span class="text-condition">${state.offlineSim?'Modo campo':'Modo demonstrativo'}</span><span class="tiny" style="color:inherit">${state.offlineSim?'Offline simulado':'Online simulado'}</span></button><button class="icon-button" data-action="toIntelligence" title="Inteligência agrícola" aria-label="Inteligência agrícola">${icon('news',18)}</button><button class="icon-button" data-action="assistantFromHome" title="Assistente Agrion" aria-label="Assistente Agrion">${icon('brain',18)}</button></div></div>
      ${mainPage()}<div class="footer-note">Agrion · Protótipo V3.1 · Dados demonstrativos, sem consulta real à NASA ou geração de recomendações. Registros do usuário ficam neste navegador (IndexedDB), quando disponível.</div></main></div>
      <nav class="mobile-nav" aria-label="Navegação inferior">${navs.map(n=>`<button type="button" class="${active(n[0])?'active':''}" aria-current="${active(n[0])?'page':'false'}" data-action="nav" data-page="${n[0]}">${icon(n[2],20)}<span>${n[1]}</span></button>`).join('')}</nav></div><div id="toastMount" aria-live="polite"></div>${modalHtml()}`;renderToast();}
  async function perform(action,el){
    if(action.startsWith('property')){AgrionProperty.action(action);return}
    switch(action){
      case 'welcomeSoon':notify('Funcionalidade disponível em breve.');break;
      case 'nav':navigate(el.dataset.page==='plan'?'plan':el.dataset.page);break;
      case 'toPlan':navigate('plan');break;
      case 'toDiscover':navigate('discover');break;
      case 'toMap':navigate('map');break;
      case 'toSafra':navigate('safra');break;
      case 'toIntelligence':navigate('intelligence');break;
      case 'goOnboarding':state.step=state.onboarded?0:state.step;navigate('onboarding');break;
      case 'stepBack':if(state.step===0)navigate('home');else{state.step--;persist();render()}break;
      case 'stepNext':{
        if(state.step===0&&!state.region.trim()){notify('Informe pelo menos município e estado para continuar.');return}
        if(state.step<3){state.step++;persist();render();window.scrollTo({top:0,behavior:'instant'});return}
        state.onboarded=true;
        if(state.experience==='undecided'||!state.crops.length){state.discoverSelected=[];navigate('discover')}
        else{state.focusCrop=state.crops[0];state.discoverSelected=[...state.crops];navigate('plan')}
        notify('Cadastro de demonstração salvo neste navegador. A localização não foi validada.');break;
      }
      case 'experience':state.experience=el.dataset.value;persist();render();break;
      case 'soil':state.soil=el.dataset.value;persist();render();break;
      case 'goal':state.goal=el.dataset.value;persist();render();break;
      case 'toggleCrop':state.crops=state.crops.includes(el.dataset.name)?state.crops.filter(x=>x!==el.dataset.name):[...state.crops,el.dataset.name];persist();render();break;
      case 'toggleDiscover':state.discoverSelected=state.discoverSelected.includes(el.dataset.name)?state.discoverSelected.filter(x=>x!==el.dataset.name):[...state.discoverSelected,el.dataset.name];persist();render();break;
      case 'fromDiscover':if(!state.discoverSelected.length){notify('Escolha pelo menos uma cultura para investigar.');return}state.focusCrop=state.discoverSelected[0];state.planSaved=false;state.season='none';state.planId='b';navigate('plan');break;
      case 'selectPlan':state.planId=el.dataset.id;persist();render();break;
      case 'detailTab':state.detailTab=el.dataset.id;persist();render();break;
      case 'savePlan':state.planSaved=true;state.season='planned';persist();navigate('safra');notify('Estratégia selecionada na demonstração. Nenhuma viabilidade agronômica foi validada.');break;
      case 'mapLayer':state.mapLayer=el.dataset.id;persist();render();break;
      case 'mapField':state.mapField=el.dataset.name;state.recordField=el.dataset.name;persist();render();break;
      case 'newRecord':state.recordField=state.page==='map'?state.mapField:state.recordField;state.recordLat=null;state.recordLong=null;state.recordLocationAccuracy=null;navigate('record');break;
      case 'recordType':state.recordType=el.dataset.value;persist();render();break;
      case 'removePhoto':clearFile();render();break;
      case 'getGPS':{
        if(!navigator.geolocation){notify('Este navegador não oferece geolocalização. Selecione apenas o talhão.');return}
        notify('Solicitando autorização para obter coordenadas no seu dispositivo.');
        navigator.geolocation.getCurrentPosition(pos=>{state.recordLat=pos.coords.latitude;state.recordLong=pos.coords.longitude;state.recordLocationAccuracy=pos.coords.accuracy;persist();render();notify('Coordenadas obtidas. Ainda não serão posicionadas no mapa ilustrativo.');},err=>{notify('Localização indisponível ou permissão não concedida. Você pode continuar indicando somente o talhão.');},{enableHighAccuracy:true,timeout:10000,maximumAge:0});break;
      }
      case 'saveRecord':{
        if(idbUnavailable){notify('O armazenamento persistente está indisponível neste navegador.');return}
        const raw={ph:state.recordPH.trim(),moisture:state.recordMoisture.trim(),temperature:state.recordTemp.trim(),light:state.recordLight.trim()};
        if(!state.recordNote.trim()&&!photoFile&&!(state.recordType==='meter'&&Object.values(raw).some(v=>v!==''))){notify('Acrescente uma fotografia, uma leitura ou uma descrição antes de salvar.');return}
        const r={id:id(),created:Date.now(),type:state.recordType,field:state.recordField,note:state.recordNote.trim(),measurements:state.recordType==='meter'?raw:{},lat:state.recordLat,long:state.recordLong,accuracy:state.recordLocationAccuracy,photo:photoFile||null,status:'local'};
        el.disabled=true;el.textContent='Gravando no dispositivo...';
        try{await addRecord(r);records=await readAll();clearFile();state.recordNote='';state.recordPH='';state.recordMoisture='';state.recordTemp='';state.recordLight='';state.recordLat=null;state.recordLong=null;state.recordLocationAccuracy=null;persist();navigate('safra');notify('Registro gravado neste navegador. Sem sincronização com servidor.');}
        catch(e){el.disabled=false;el.textContent='Tentar salvar novamente';notify('Não foi possível confirmar a gravação. O registro não foi marcado como salvo.');}
        break;
      }
      case 'filterDiary':state.filterDiary=el.dataset.id;persist();render();break;
      case 'viewRecord':state.viewRecord=el.dataset.id;navigate('recordDetail');break;
      case 'askStartSeason':state.modal='start';render();break;
      case 'askCloseSeason':state.modal='close';render();break;
      case 'askReset':state.modal='reset';render();break;
      case 'cancelModal':state.modal=null;render();break;
      case 'confirmStart':state.season='active';state.modal=null;persist();render();notify('Início do cultivo confirmado na demonstração.');break;
      case 'confirmClose':state.season='closed';state.modal=null;persist();render();notify('Safra encerrada nesta demonstração. Registros preservados.');break;
      case 'confirmReset':{
        try{await removeAllRecords();for(const url of photoURLs.values())URL.revokeObjectURL(url);photoURLs.clear();records=[];clearFile();state={...seed};persist();navigate('home');notify('Demonstração reiniciada. Dados locais apagados.');}
        catch(e){state.modal=null;render();notify('Não foi possível apagar todos os registros locais.');}
        break;
      }
      case 'intelFilter':state.intelFilter=el.dataset.id;persist();render();break;
      case 'openArticle':state.article=el.dataset.id;navigate('article');break;
      case 'toggleBookmark':if(!state.article)return;state.bookmarks=state.bookmarks.includes(state.article)?state.bookmarks.filter(x=>x!==state.article):[...state.bookmarks,state.article];persist();render();break;
      case 'assistantFromArticle':{
        const s=stories.find(x=>x.id===state.article);beginAssistant('Informação ilustrativa: '+(s?s.title:'sem conteúdo'),'article');break;
      }
      case 'assistantFromHome':beginAssistant('Visão geral da propriedade',state.page);break;
      case 'assistantFromPlan':beginAssistant('Estratégia '+pselected().name+' · '+state.focusCrop,'plan');break;
      case 'assistantFromMap':beginAssistant(state.mapField+' · registros da propriedade','map');break;
      case 'assistantFromRecord':{
        const r=records.find(x=>x.id===state.viewRecord);beginAssistant('Registro: '+(r?r.field+' — '+(r.note||'sem observação textual'):'observação'),'recordDetail');break;
      }
      case 'assistantBack':navigate(state.assistantReturn||'home');break;
      case 'askSuggestion':{const box=$('assistantInput');if(box){box.value=el.dataset.text||'';box.focus()}break;}
      case 'sendQuestion':{
        const text=$('assistantInput')?.value.trim();if(!text){notify('Escreva uma pergunta antes de continuar.');return}
        if(state.offlineSim){notify('Modo campo simulado: consultas online estão indisponíveis.');return}
        state.messages=[...state.messages,{role:'user',text},{role:'system',text:'Pergunta registrada na demonstração. Não há modelo de IA conectado; nenhuma resposta ou recomendação foi gerada.'}].slice(-20);persist();render();break;
      }
      case 'assistantToRecord':{
        const text=$('assistantInput')?.value.trim();state.recordNote=text||state.recordNote;state.recordType='note';navigate('record');notify('Rascunho preparado. Revise o conteúdo antes de salvar o registro.');break;
      }
      case 'toggleOffline':state.offlineSim=!state.offlineSim;persist();render();notify(state.offlineSim?'Modo campo ativado apenas para simulação. O navegador não foi desconectado.':'Simulação online ativada. O modo demonstrativo continua ativo.');break;
      default:console.warn('Unknown action',action)
    }
  }
  document.addEventListener('click',e=>{
    const mapField=e.target.closest('[data-mapfield]');if(mapField){state.mapField=mapField.dataset.mapfield;state.recordField=state.mapField;persist();render();return}
    const target=e.target.closest('[data-action]');if(!target)return;e.preventDefault();perform(target.dataset.action,target).catch(err=>{console.error(err);notify('Esta ação não pôde ser concluída.')});
  });
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.getAttribute('role')==='button'&&e.target.dataset.action){e.preventDefault();perform(e.target.dataset.action,e.target)}if(e.key==='Escape'&&state.modal){state.modal=null;render()}});
  document.addEventListener('input',e=>{const node=e.target;if(node.dataset.bind){state[node.dataset.bind]=node.value;persist()}});
  document.addEventListener('change',e=>{
    if(e.target.id==='photoFile'){const f=e.target.files&&e.target.files[0];if(f&&f.size>15*1024*1024){notify('Selecione uma imagem de até 15 MB para esta demonstração.');return}if(f)prepareFile(f);return}
    if(e.target.dataset.bind){state[e.target.dataset.bind]=e.target.value;persist();if(['compareA','compareB','irrigation','market','recordField'].includes(e.target.dataset.bind))render();}
  });
  (async function init(){render();try{await AgrionDiscovery.restore();}catch(error){console.error('Não foi possível restaurar o Discovery',error)}db=await openDb();idbUnavailable=!db;records=await readAll();if(state.page!=='home')render()})();
  </script>
</body>
</html>
